<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Sherwin-Williams AOR — Warehouse Control System</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg0:#050810;--bg1:#080d1a;--bg2:#0d1425;--bg3:#111c30;
  --border:#1a2840;--border2:#203050;
  --neon:#00d4ff;--neon2:#0090cc;--neon-glow:rgba(0,212,255,0.25);
  --green:#00ff88;--amber:#ffaa00;--red:#ff3355;--purple:#aa44ff;--cyan:#00eeff;
  --text:#c8dff0;--text2:#6a8aaa;--text3:#344a60;
}
html,body,#root{height:100%;width:100%;overflow:hidden}
body{background:var(--bg0);font-family:'Rajdhani',sans-serif;color:var(--text)}
#root{display:flex;flex-direction:column}

/* ── TOP BAR ── */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;height:52px;
  background:linear-gradient(90deg,var(--bg1),var(--bg2));
  border-bottom:1px solid var(--border2);
  flex-shrink:0;
}
.logo{font-family:'Share Tech Mono',monospace;font-size:14px;letter-spacing:3px;color:var(--neon)}
.logo em{color:var(--amber);font-style:normal}
.topbar-metrics{display:flex;gap:12px}
.tm{text-align:center;padding:4px 12px;background:var(--bg0);border:1px solid var(--border);border-radius:3px;min-width:70px}
.tm .v{font-size:18px;font-weight:700;color:var(--neon);font-family:'Share Tech Mono',monospace;line-height:1}
.tm .l{font-size:9px;letter-spacing:2px;color:var(--text3);text-transform:uppercase;margin-top:2px}
.tm.warn .v{color:var(--amber)}
.tm.danger .v{color:var(--red)}
.tm.ok .v{color:var(--green)}
.clock{font-family:'Share Tech Mono',monospace;font-size:13px;color:var(--text2)}

/* ── LAYOUT ── */
.layout{display:flex;flex:1;overflow:hidden}

/* ── SCANNER SIDEBAR ── */
.scanner-panel{
  width:200px;flex-shrink:0;
  background:var(--bg1);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden
}
.sp-header{
  padding:10px 12px;border-bottom:1px solid var(--border);
  font-size:10px;letter-spacing:2px;color:var(--text3);text-transform:uppercase
}
.scanner-list{flex:1;overflow-y:auto;padding:6px}
.scanner-list::-webkit-scrollbar{width:4px}
.scanner-list::-webkit-scrollbar-track{background:var(--bg0)}
.scanner-list::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

.scanner-group{margin-bottom:10px}
.sg-label{font-size:9px;letter-spacing:2px;color:var(--text3);text-transform:uppercase;padding:4px 6px;margin-bottom:4px}
.scanner-btn{
  display:flex;align-items:center;gap:8px;width:100%;
  padding:7px 10px;margin-bottom:3px;
  background:var(--bg0);border:1px solid var(--border);border-radius:4px;
  color:var(--text2);font-size:11px;cursor:pointer;
  transition:all .2s;font-family:'Share Tech Mono',monospace;text-align:left
}
.scanner-btn:hover{background:var(--bg2);border-color:var(--neon2);color:var(--neon)}
.scanner-btn.active{background:#041825;border-color:var(--neon);color:var(--neon);box-shadow:0 0 8px var(--neon-glow)}
.scanner-btn.pulsing{animation:scanPulse .6s ease-in-out}
.scanner-btn.fault{border-color:var(--red);color:var(--red)}
@keyframes scanPulse{0%,100%{background:var(--bg0)}50%{background:#0d2535;border-color:var(--neon)}}
.sc-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:var(--text3);transition:all .2s}
.scanner-btn.active .sc-dot{background:var(--neon);box-shadow:0 0 6px var(--neon)}
.scanner-btn.fault .sc-dot{background:var(--red);animation:blink .5s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}

/* ── WAREHOUSE CANVAS AREA ── */
.warehouse-area{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
.canvas-wrap{flex:1;position:relative;overflow:hidden;background:var(--bg0)}
canvas{display:block}

/* ── BOTTOM EVENT LOG ── */
.event-bar{
  height:90px;flex-shrink:0;
  background:var(--bg1);border-top:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden
}
.eb-header{
  padding:5px 14px;border-bottom:1px solid var(--border);
  font-size:9px;letter-spacing:2px;color:var(--text3);text-transform:uppercase;flex-shrink:0
}
.eb-log{flex:1;overflow-y:auto;padding:4px 14px;display:flex;flex-direction:column-reverse}
.eb-log::-webkit-scrollbar{width:3px}
.eb-log::-webkit-scrollbar-thumb{background:var(--border)}
.ev{font-size:10px;padding:2px 0;border-bottom:1px solid #0a1020;display:flex;gap:8px;font-family:'Share Tech Mono',monospace}
.ev .et{color:var(--text3);min-width:50px}
.ev .em{color:var(--text2)}
.ev.ok .em{color:var(--green)}
.ev.warn .em{color:var(--amber)}
.ev.err .em{color:var(--red)}
.ev.info .em{color:var(--neon)}

/* ── RIGHT DETAIL PANEL ── */
.detail-panel{
  width:260px;flex-shrink:0;
  background:var(--bg1);border-left:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden
}
.dp-header{
  padding:10px 14px;border-bottom:1px solid var(--border);
  font-size:10px;letter-spacing:2px;color:var(--text3);text-transform:uppercase
}
.dp-body{flex:1;overflow-y:auto;padding:12px}
.dp-body::-webkit-scrollbar{width:4px}
.dp-body::-webkit-scrollbar-thumb{background:var(--border2)}

/* scanner detail */
.sc-title{font-size:20px;font-weight:700;color:var(--neon);margin-bottom:2px;letter-spacing:1px}
.sc-subtitle{font-size:11px;color:var(--text3);margin-bottom:12px;text-transform:uppercase;letter-spacing:1px}
.sc-status-badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 10px;border-radius:2px;font-size:10px;font-weight:600;letter-spacing:1px;
  text-transform:uppercase;margin-bottom:12px
}
.sc-status-badge.scanning{background:#041825;border:1px solid var(--neon);color:var(--neon)}
.sc-status-badge.idle{background:#0a0a0a;border:1px solid var(--border);color:var(--text3)}
.sc-status-badge.fault{background:#180808;border:1px solid var(--red);color:var(--red)}
.info-section{margin-bottom:14px}
.is-label{font-size:9px;letter-spacing:2px;color:var(--text3);text-transform:uppercase;margin-bottom:6px;border-bottom:1px solid var(--border);padding-bottom:3px}
.info-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:11px}
.info-row .k{color:var(--text3)}
.info-row .val{color:var(--text);font-weight:600;text-align:right;max-width:150px}
.info-row .val.neon{color:var(--neon)}
.info-row .val.amber{color:var(--amber)}
.info-row .val.green{color:var(--green)}
.info-row .val.red{color:var(--red)}

.cond-list{display:flex;flex-direction:column;gap:4px}
.cond-item{
  padding:6px 8px;border-radius:3px;font-size:10px;line-height:1.5;
  background:var(--bg2);border-left:3px solid var(--neon2);color:var(--text)
}
.cond-item.warn{border-color:var(--amber)}
.cond-item.route{border-color:var(--green)}
.cond-item.reject{border-color:var(--red)}
.cond-item .cond-head{font-weight:700;color:var(--neon);font-size:11px;margin-bottom:2px}
.cond-item.warn .cond-head{color:var(--amber)}
.cond-item.route .cond-head{color:var(--green)}
.cond-item.reject .cond-head{color:var(--red)}

.anim-section{margin-top:10px}
.anim-label{font-size:9px;letter-spacing:2px;color:var(--text3);text-transform:uppercase;margin-bottom:6px}
.flow-diagram{background:var(--bg0);border:1px solid var(--border);border-radius:4px;padding:10px;position:relative;min-height:60px}
.flow-node{
  display:inline-flex;align-items:center;justify-content:center;
  padding:4px 8px;border-radius:2px;font-size:10px;font-weight:600;
  background:var(--bg2);border:1px solid var(--border2);color:var(--text2);
  font-family:'Share Tech Mono',monospace
}
.flow-node.active{background:#041825;border-color:var(--neon);color:var(--neon);box-shadow:0 0 8px var(--neon-glow);animation:nodeGlow 1.5s ease-in-out infinite}
@keyframes nodeGlow{0%,100%{box-shadow:0 0 4px var(--neon-glow)}50%{box-shadow:0 0 14px var(--neon-glow)}}
.flow-arrow{color:var(--neon2);font-size:14px;margin:0 4px;animation:arrowFlow .8s ease-in-out infinite}
@keyframes arrowFlow{0%,100%{opacity:0.4;transform:translateX(0)}50%{opacity:1;transform:translateX(3px)}}
.flow-row{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-bottom:6px}

.sim-controls{display:flex;gap:6px;margin-top:12px}
.sim-btn{
  flex:1;padding:6px 4px;border-radius:3px;font-size:10px;font-weight:600;
  letter-spacing:1px;text-transform:uppercase;cursor:pointer;border:1px solid;
  font-family:'Rajdhani',sans-serif;transition:all .2s
}
.sim-btn.run{background:#041825;border-color:var(--neon);color:var(--neon)}
.sim-btn.run:hover{background:#082035;box-shadow:0 0 10px var(--neon-glow)}
.sim-btn.fault{background:#180808;border-color:var(--red);color:var(--red)}
.sim-btn.fault:hover{background:#280a0a}
.sim-btn.reset{background:var(--bg2);border-color:var(--border2);color:var(--text2)}
.sim-btn.reset:hover{border-color:var(--amber);color:var(--amber)}

/* ── ENTITY COUNTER STRIP ── */
.entity-strip{
  display:flex;gap:6px;padding:6px 14px;
  background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0
}
.ent-chip{
  display:flex;align-items:center;gap:5px;padding:3px 10px;
  border-radius:2px;font-size:10px;font-weight:600;letter-spacing:1px;
  background:var(--bg0);border:1px solid var(--border);cursor:pointer;transition:all .2s
}
.ent-chip:hover{border-color:var(--neon2)}
.ent-chip.on{border-color:var(--neon);color:var(--neon)}
.ent-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}

/* ── MINI-MAP ── */
.minimap{
  position:absolute;bottom:10px;right:10px;
  width:120px;height:80px;background:rgba(8,13,26,0.9);
  border:1px solid var(--border2);border-radius:3px;overflow:hidden;
  pointer-events:none
}
</style>
</head>

/* ════════════════════════════════════════════
   UTILITIES
   ════════════════════════════════════════════ */
const lerp=(a,b,t)=>a+(b-a)*t;
const dist=(a,b)=>Math.sqrt((b.x-a.x)**2+(b.y-a.y)**2);

function genId(){ return Math.random().toString(36).slice(2,7).toUpperCase(); }

/* ════════════════════════════════════════════
   CANVAS RENDERER
   ════════════════════════════════════════════ */
function drawWarehouse(canvas, state, selectedScanner, activeScannerId){
  if(!canvas) return;
  const ctx=canvas.getContext('2d');
  const W=canvas.width, H=canvas.height;
  const sx=W/560, sy=H/520;

  ctx.clearRect(0,0,W,H);

  // Grid
  ctx.strokeStyle='#0d1525';ctx.lineWidth=0.5;
  for(let x=0;x<W;x+=20*sx) { ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke(); }
  for(let y=0;y<H;y+=20*sy) { ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke(); }

  // Zones
  LAYOUT.zones.forEach(z=>{
    ctx.fillStyle=z.color;
    ctx.strokeStyle='#1a2840';ctx.lineWidth=1;
    ctx.beginPath();
    ctx.roundRect(z.x*sx,z.y*sy,z.w*sx,z.h*sy,4*sx);
    ctx.fill();ctx.stroke();
    ctx.fillStyle='#1e3050';
    ctx.font=`bold ${9*sx}px 'Share Tech Mono',monospace`;
    ctx.textAlign='left';
    ctx.fillText(z.label,z.x*sx+8*sx,(z.y+14)*sy);
  });

  // Conveyors
  LAYOUT.conveyors.forEach(c=>{
    const isCrane=c.type==='crane';
    ctx.strokeStyle=isCrane?'#2a1a3a':c.color;
    ctx.lineWidth=isCrane?5*sx:4*sx;
    ctx.setLineDash(isCrane?[6*sx,3*sx]:[4*sx,3*sx]);
    ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(c.from.x*sx,c.from.y*sy);ctx.lineTo(c.to.x*sx,c.to.y*sy);ctx.stroke();

    // Animated belt lines
    const t=(Date.now()%1200)/1200;
    ctx.strokeStyle=isCrane?'#3a1a5a':'#1a3050';
    ctx.lineWidth=1;
    const dx=(c.to.x-c.from.x),dy=(c.to.y-c.from.y);
    const len=Math.sqrt(dx*dx+dy*dy);
    const ux=dx/len,uy=dy/len;
    for(let i=0;i<6;i++){
      const tt=((t+i/6)%1);
      const bx=(c.from.x+dx*tt)*sx;
      const by=(c.from.y+dy*tt)*sy;
      ctx.beginPath();ctx.arc(bx,by,1.5*sx,0,Math.PI*2);ctx.fill();
    }
    ctx.setLineDash([]);
  });

  // Scanner nodes
  Object.values(SCANNER_DATA).forEach(sc=>{
    const isSelected=sc.id===selectedScanner;
    const isActive=sc.id===activeScannerId;
    const scx=sc.x*sx, scy=sc.y*sy;
    const r=14*sx;

    // Outer glow
    if(isSelected||isActive){
      const g=ctx.createRadialGradient(scx,scy,r,scx,scy,r*3);
      g.addColorStop(0,'rgba(0,212,255,0.3)');g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(scx,scy,r*3,0,Math.PI*2);ctx.fill();
    }

    // Pulse ring (scanning animation)
    if(isActive){
      const pulse=(Math.sin(Date.now()/300)+1)/2;
      ctx.strokeStyle=`rgba(0,212,255,${0.2+0.4*pulse})`;
      ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(scx,scy,r*(1.5+0.5*pulse),0,Math.PI*2);ctx.stroke();
    }

    // Scanner beam (cross)
    if(isActive){
      const beam=(Math.sin(Date.now()/200)+1)/2;
      ctx.strokeStyle=`rgba(0,212,255,${0.3*beam})`;
      ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(scx-r*2,scy);ctx.lineTo(scx+r*2,scy);ctx.stroke();
      ctx.beginPath();ctx.moveTo(scx,scy-r*2);ctx.lineTo(scx,scy+r*2);ctx.stroke();
    }

    // Node body
    const typeColors={
      conveyor:'#041825',crane:'#0d0420',sort:'#04180a',
      reject:'#180408',shipping:'#04141c',pallet:'#0a1804'
    };
    const typeBorders={
      conveyor:'#00d4ff',crane:'#aa44ff',sort:'#00ff88',
      reject:'#ff3355',shipping:'#00eeff',pallet:'#ffaa00'
    };
    ctx.fillStyle=isSelected?typeColors[sc.type]||'#041825':typeColors[sc.type]||'#0d1828';
    ctx.strokeStyle=isSelected||isActive?typeBorders[sc.type]||'#00d4ff':'#1e3050';
    ctx.lineWidth=isSelected?2.5:1.5;
    ctx.beginPath();ctx.arc(scx,scy,r,0,Math.PI*2);ctx.fill();ctx.stroke();

    // Inner dot
    ctx.fillStyle=typeBorders[sc.type]||'#00d4ff';
    ctx.beginPath();ctx.arc(scx,scy,3*sx,0,Math.PI*2);ctx.fill();

    // Label
    ctx.fillStyle=isSelected||isActive?typeBorders[sc.type]||'#00d4ff':'#2a4a6a';
    ctx.font=`${isSelected?'bold ':''} ${8*sx}px 'Share Tech Mono',monospace`;
    ctx.textAlign='center';
    ctx.fillText(sc.label,scx,(scy+r+10)*sy/sy);
  });

  // Entities
  state.entities.forEach(e=>{
    const ex=e.x*sx, ey=e.y*sy;
    const typeColor={tote:'#00ff88',container:'#ffaa00',pallet:'#aa44ff',crane:'#ff3355'};
    const col=typeColor[e.type]||'#fff';

    if(e.type==='crane'){
      // Crane: draw rail + body
      ctx.strokeStyle='rgba(255,51,85,0.2)';ctx.lineWidth=2;ctx.setLineDash([4,4]);
      ctx.beginPath();ctx.moveTo(20*sx,ey);ctx.lineTo(520*sx,ey);ctx.stroke();
      ctx.beginPath();ctx.moveTo(ex,20*sy);ctx.lineTo(ex,480*sy);ctx.stroke();
      ctx.setLineDash([]);
      // Crane body
      ctx.fillStyle='#1a0808';ctx.strokeStyle=col;ctx.lineWidth=2;
      ctx.beginPath();ctx.roundRect(ex-14*sx,ey-14*sy,28*sx,28*sy,3*sx);ctx.fill();ctx.stroke();
      // Crane arm
      ctx.strokeStyle=col;ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(ex,ey+20*sy);ctx.stroke();
      ctx.beginPath();ctx.moveTo(ex-10*sx,ey+20*sy);ctx.lineTo(ex+10*sx,ey+20*sy);ctx.stroke();
      ctx.fillStyle=col;
      ctx.font=`${10*sx}px sans-serif`;ctx.textAlign='center';
      ctx.fillText('🏗',ex,ey+4*sy);
    } else if(e.type==='tote'){
      ctx.fillStyle=col;
      ctx.shadowColor=col;ctx.shadowBlur=8;
      ctx.beginPath();ctx.arc(ex,ey,7*sx,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;
      ctx.strokeStyle='rgba(0,255,136,0.4)';ctx.lineWidth=1;
      ctx.beginPath();ctx.arc(ex,ey,10*sx,0,Math.PI*2);ctx.stroke();
    } else if(e.type==='container'){
      ctx.fillStyle='#1a0e00';ctx.strokeStyle=col;ctx.lineWidth=1.5;
      ctx.shadowColor=col;ctx.shadowBlur=6;
      ctx.beginPath();ctx.roundRect(ex-9*sx,ey-9*sy,18*sx,18*sy,2*sx);ctx.fill();ctx.stroke();
      ctx.shadowBlur=0;
      ctx.fillStyle=col;ctx.font=`bold ${9*sx}px sans-serif`;ctx.textAlign='center';
      ctx.fillText('■',ex,ey+3*sy);
    } else if(e.type==='pallet'){
      ctx.fillStyle='#100520';ctx.strokeStyle=col;ctx.lineWidth=2;
      ctx.shadowColor=col;ctx.shadowBlur=8;
      ctx.beginPath();ctx.roundRect(ex-12*sx,ey-8*sy,24*sx,16*sy,2*sx);ctx.fill();ctx.stroke();
      ctx.shadowBlur=0;
      // Pallet slat lines
      ctx.strokeStyle=`rgba(170,68,255,0.4)`;ctx.lineWidth=0.5;
      for(let i=1;i<3;i++){
        ctx.beginPath();
        ctx.moveTo((ex-12)*sx,ey-8*sy+i*(16/3)*sy);
        ctx.lineTo((ex+12)*sx,ey-8*sy+i*(16/3)*sy);
        ctx.stroke();
      }
    }
  });
}

/* ════════════════════════════════════════════
   ENTITY SIMULATION HOOK
   ════════════════════════════════════════════ */
function useEntitySim(running){
  const [entities, setEntities]=useState([]);
  const stateRef=useRef({entities:[],frame:0,paths:{...ENTITY_PATHS}});

  const spawnEntity=useCallback((type)=>{
    const paths=ENTITY_PATHS[type]||ENTITY_PATHS.tote;
    const path=paths[Math.floor(Math.random()*paths.length)].map(p=>({...p}));
    const e={
      id:genId(), type,
      x:path[0].x, y:path[0].y,
      path, pathIdx:0, progress:0,
      speed:type==='tote'?1.8:type==='container'?1.0:type==='crane'?0.6:0.5,
      done:false
    };
    stateRef.current.entities=[...stateRef.current.entities,e];
  },[]);

  useEffect(()=>{
    // initial entities
    for(let i=0;i<4;i++) spawnEntity('tote');
    spawnEntity('container');
    spawnEntity('pallet');
    spawnEntity('crane');
  },[]);

  useEffect(()=>{
    let raf;
    const tick=()=>{
      raf=requestAnimationFrame(tick);
      if(!running) return;
      stateRef.current.frame++;
      stateRef.current.entities=stateRef.current.entities
        .filter(e=>!e.done)
        .map(e=>{
          if(e.pathIdx>=e.path.length-1){return{...e,done:true};}
          const nxt=e.path[e.pathIdx+1];
          const dx=nxt.x-e.x,dy=nxt.y-e.y;
          const d=Math.sqrt(dx*dx+dy*dy)||1;
          const spd=e.speed;
          const nx=e.x+dx/d*spd, ny=e.y+dy/d*spd;
          if(d<spd+1){
            return{...e,x:nxt.x,y:nxt.y,pathIdx:e.pathIdx+1};
          }
          return{...e,x:nx,y:ny};
        });

      // respawn
      const counts={tote:0,container:0,pallet:0,crane:0};
      stateRef.current.entities.forEach(e=>counts[e.type]=(counts[e.type]||0)+1);
      if(stateRef.current.frame%120===0&&counts.tote<6) spawnEntity('tote');
      if(stateRef.current.frame%200===0&&counts.container<3) spawnEntity('container');
      if(stateRef.current.frame%300===0&&counts.pallet<2) spawnEntity('pallet');
      if(stateRef.current.frame%400===0&&counts.crane<1) spawnEntity('crane');

      setEntities([...stateRef.current.entities]);
    };
    raf=requestAnimationFrame(tick);
    return()=>cancelAnimationFrame(raf);
  },[running]);

  return {entities, spawnEntity};
}

/* ════════════════════════════════════════════
   MAIN APP
   ════════════════════════════════════════════ */
function App(){
  const [selectedSc, setSelectedSc]=useState(null);
  const [running, setRunning]=useState(true);
  const [activeScId, setActiveScId]=useState(null);
  const [faultScs, setFaultScs]=useState({});
  const [filters, setFilters]=useState({tote:true,container:true,pallet:true,crane:true});
  const [events, setEvents]=useState([{type:'ok',msg:'AOR System ONLINE',t:0},{type:'info',msg:'All scanners initialized',t:0}]);
  const [tick,setTick]=useState(0);
  const canvasRef=useRef(null);
  const wrapRef=useRef(null);

  const {entities, spawnEntity}=useEntitySim(running);
  const [simTime,setSimTime]=useState(0);

  const log=useCallback((type,msg)=>{
    setEvents(ev=>[{type,msg,t:Date.now()},...ev].slice(0,60));
  },[]);

  // Clock
  useEffect(()=>{
    if(!running)return;
    const iv=setInterval(()=>setSimTime(t=>t+1),1000);
    return()=>clearInterval(iv);
  },[running]);

  // Canvas resize
  useEffect(()=>{
    const ob=new ResizeObserver(()=>{
      if(!wrapRef.current||!canvasRef.current)return;
      const r=wrapRef.current.getBoundingClientRect();
      canvasRef.current.width=r.width;
      canvasRef.current.height=r.height;
    });
    if(wrapRef.current) ob.observe(wrapRef.current);
    return()=>ob.disconnect();
  },[]);

  // Draw loop
  useEffect(()=>{
    let raf;
    const loop=()=>{
      raf=requestAnimationFrame(loop);
      if(!canvasRef.current)return;
      const visEntities=entities.filter(e=>filters[e.type]);
      drawWarehouse(canvasRef.current,{entities:visEntities},selectedSc,activeScId);
    };
    raf=requestAnimationFrame(loop);
    return()=>cancelAnimationFrame(raf);
  },[entities,selectedSc,activeScId,filters]);

  const handleScannerClick=(id)=>{
    setSelectedSc(id);
    setActiveScId(id);
    const sc=SCANNER_DATA[id];
    log('info',`Scanner ${sc.label} selected — ${sc.type.toUpperCase()}`);
    setTimeout(()=>setActiveScId(null),3000);
  };

  const handleSimulate=(id)=>{
    setActiveScId(id);
    const sc=SCANNER_DATA[id];
    const types=sc.entities;
    types.forEach(t=>spawnEntity(t));
    log('ok',`Simulating ${sc.label}: spawned ${types.join(', ')}`);
    setTimeout(()=>setActiveScId(null),4000);
  };

  const handleFault=(id)=>{
    const sc=SCANNER_DATA[id];
    setFaultScs(f=>({...f,[id]:true}));
    log('err',`FAULT on ${sc.label} — scanner offline`);
    setTimeout(()=>{
      setFaultScs(f=>{const n={...f};delete n[id];return n;});
      log('ok',`${sc.label} fault cleared — back online`);
    },5000+Math.random()*3000);
  };

  const handleReset=()=>{
    setSelectedSc(null);setActiveScId(null);setFaultScs({});
    log('info','System reset');
  };

  const h=String(Math.floor(simTime/3600)).padStart(2,'0');
  const m=String(Math.floor(simTime/60)%60).padStart(2,'0');
  const s=String(simTime%60).padStart(2,'0');

  const toteCount=entities.filter(e=>e.type==='tote').length;
  const craneCount=entities.filter(e=>e.type==='crane').length;
  const faultCount=Object.keys(faultScs).length;

  const selectedScData=selectedSc?SCANNER_DATA[selectedSc]:null;

  return (
    <div id="app" style={{display:'flex',flexDirection:'column',height:'100%',background:'var(--bg0)'}}>
      {/* TOP BAR */}
      <div className="topbar">
        <div className="logo">SW–AOR <em>CONTROL CENTER</em></div>
        <div className="topbar-metrics">
          <div className="tm ok"><div className="v">{entities.length}</div><div className="l">Active</div></div>
          <div className="tm"><div className="v">{toteCount}</div><div className="l">Totes</div></div>
          <div className="tm warn"><div className="v">{craneCount}</div><div className="l">Cranes</div></div>
          <div className="tm danger" style={faultCount>0?{}:{opacity:0.4}}>
            <div className="v">{faultCount}</div><div className="l">Faults</div>
          </div>
          <div className={`tm ${running?'ok':'warn'}`}>
            <div className="v" style={{fontSize:13}}>{running?'LIVE':'PAUSED'}</div>
            <div className="l">Status</div>
          </div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <button onClick={()=>{setRunning(r=>!r);log('info',running?'Simulation paused':'Simulation resumed');}}
            style={{padding:'5px 14px',background:running?'#041825':'#080808',border:`1px solid ${running?'var(--neon)':'var(--amber)'}`,borderRadius:3,color:running?'var(--neon)':'var(--amber)',fontSize:11,cursor:'pointer',fontFamily:'Rajdhani',fontWeight:600,letterSpacing:1}}>
            {running?'⏸ PAUSE':'▶ RESUME'}
          </button>
          <div className="clock">{h}:{m}:{s}</div>
        </div>
      </div>

      <div className="layout" style={{flex:1,overflow:'hidden'}}>
        {/* SCANNER SIDEBAR */}
        <div className="scanner-panel">
          <div className="sp-header">Scanner Nodes</div>
          <div className="scanner-list">
            {SCANNER_GROUPS.map(g=>(
              <div key={g.group} className="scanner-group">
                <div className="sg-label">{g.group}</div>
                {g.ids.map(id=>{
                  const sc=SCANNER_DATA[id];
                  const isFault=!!faultScs[id];
                  const isActive=activeScId===id;
                  const isSelected=selectedSc===id;
                  const typeColor={conveyor:'var(--neon)',crane:'var(--purple)',sort:'var(--green)',reject:'var(--red)',shipping:'var(--cyan)',pallet:'var(--amber)'}[sc.type]||'var(--neon)';
                  return (
                    <button key={id}
                      className={`scanner-btn${isSelected?' active':''}${isFault?' fault':''}${isActive?' pulsing':''}`}
                      onClick={()=>handleScannerClick(id)}>
                      <span className="sc-dot" style={isSelected&&!isFault?{background:typeColor,boxShadow:`0 0 6px ${typeColor}`}:{}}/>
                      <span style={{flex:1}}>{sc.label}</span>
                      <span style={{fontSize:8,opacity:0.5}}>{sc.type.toUpperCase().slice(0,3)}</span>
                    </button>
                  );
                })}
              </div>
            ))}
          </div>
        </div>

        {/* MAIN AREA */}
        <div className="warehouse-area">
          {/* Entity filter strip */}
          <div className="entity-strip">
            <span style={{fontSize:9,letterSpacing:2,color:'var(--text3)',textTransform:'uppercase',alignSelf:'center',marginRight:4}}>Show:</span>
            {[
              {key:'tote',col:'#00ff88',label:'Totes'},
              {key:'container',col:'#ffaa00',label:'Containers'},
              {key:'pallet',col:'#aa44ff',label:'Pallets'},
              {key:'crane',col:'#ff3355',label:'Cranes'},
            ].map(f=>(
              <div key={f.key}
                className={`ent-chip ${filters[f.key]?'on':''}`}
                onClick={()=>setFilters(fl=>({...fl,[f.key]:!fl[f.key]}))}
                style={{color:filters[f.key]?f.col:'var(--text3)'}}>
                <div className="ent-dot" style={{background:filters[f.key]?f.col:'var(--text3)'}}/>
                {f.label}
              </div>
            ))}
            <div style={{flex:1}}/>
            {['tote','container','pallet','crane'].map(t=>(
              <button key={t}
                onClick={()=>{spawnEntity(t);log('info',`Spawned ${t}`);}}
                style={{padding:'2px 8px',background:'var(--bg0)',border:'1px solid var(--border)',borderRadius:3,color:'var(--text3)',fontSize:9,cursor:'pointer',textTransform:'uppercase',letterSpacing:1}}>
                + {t}
              </button>
            ))}
          </div>

          <div ref={wrapRef} className="canvas-wrap"
            style={{flex:1,cursor:'crosshair'}}
            onClick={(e)=>{
              // Click on canvas → check if near a scanner
              if(!canvasRef.current) return;
              const r=canvasRef.current.getBoundingClientRect();
              const mx=(e.clientX-r.left)/r.width*560;
              const my=(e.clientY-r.top)/r.height*520;
              let closest=null,minD=30;
              Object.values(SCANNER_DATA).forEach(sc=>{
                const d=Math.sqrt((sc.x-mx)**2+(sc.y-my)**2);
                if(d<minD){minD=d;closest=sc;}
              });
              if(closest) handleScannerClick(closest.id);
            }}>
            <canvas ref={canvasRef} style={{width:'100%',height:'100%'}}/>
            {/* Legend overlay */}
            <div style={{position:'absolute',bottom:10,left:10,background:'rgba(8,13,26,0.85)',border:'1px solid var(--border)',borderRadius:4,padding:'8px 12px',fontSize:9,letterSpacing:1,color:'var(--text3)'}}>
              {[{col:'var(--neon)',l:'Conveyor'},{col:'var(--purple)',l:'Crane'},{col:'var(--green)',l:'Sort'},{col:'var(--red)',l:'Reject'},{col:'var(--cyan)',l:'Shipping'},{col:'var(--amber)',l:'Pallet'}].map(x=>(
                <div key={x.l} style={{display:'flex',alignItems:'center',gap:5,marginBottom:3}}>
                  <div style={{width:8,height:8,borderRadius:'50%',background:x.col,boxShadow:`0 0 4px ${x.col}`}}/>
                  {x.l.toUpperCase()}
                </div>
              ))}
            </div>
            {/* Click hint */}
            {!selectedSc&&(
              <div style={{position:'absolute',top:'50%',left:'50%',transform:'translate(-50%,-50%)',textAlign:'center',pointerEvents:'none',color:'var(--text3)',fontSize:11,letterSpacing:1}}>
                <div style={{fontSize:20,marginBottom:6}}>◉</div>
                Click a scanner node or sidebar button
              </div>
            )}
          </div>

          {/* EVENT LOG */}
          <div className="event-bar">
            <div className="eb-header">Live Event Log</div>
            <div className="eb-log">
              {events.map((ev,i)=>(
                <div key={i} className={`ev ${ev.type}`}>
                  <span className="et">{new Date(ev.t).toLocaleTimeString('en-GB',{hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'})}</span>
                  <span className="em">{ev.msg}</span>
                </div>
              ))}
            </div>
          </div>
        </div>

        {/* RIGHT DETAIL PANEL */}
        <div className="detail-panel">
          <div className="dp-header">
            {selectedScData?`${selectedScData.label} — Detail`:'Scanner Detail'}
          </div>
          <ScannerDetail
            sc={selectedScData}
            running={running}
            onSimulate={handleSimulate}
            onFault={handleFault}
            onReset={handleReset}
          />
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
